# ===========================================
# Nami 娜美 CF 博客 — Workers 配置
# ===========================================

name = "nami-blog-api"
main = "src/index.ts"
compatibility_date = "2025-07-01"
compatibility_flags = ["nodejs_compat"]

# ===========================================
# Production 环境
# ===========================================

[vars]
SITE_NAME = "Nami Blog"
CORS_ORIGIN = "https://nami-blog.pages.dev"

# D1 数据库绑定
[[d1_databases]]
binding = "DB"
database_name = "nami-blog"
database_id = "5b260006-2faf-46d4-8cad-8b909671f738"
migrations_dir = "../../migrations"
